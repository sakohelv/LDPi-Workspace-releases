name: Hide archived releases before v2.0.1
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: retire-old-ldpi-releases
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Unpublish verified archived releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, time
          REPO = 'sakohelv/LDPi-Workspace-releases'
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          # Private backup run 38369276429 completed successfully before this
          # manual workflow was committed: 11 releases, 36 files, 3006158969 bytes.
          # Manifest SHA256: d54ac71c3afcdda217c1e2d04954bab08f4884528be01458c57b8a6e279da07e
          # Drafts are reversible and accessible only to repository writers.
          # This workflow does not delete releases, tags or files.
          OLD = {'v1.1.1':408252964,'v1.1.0':408224824,'v1.0.9':408031169,'v1.0.8':407986102,'v1.0.7':407942660,'v1.0.6':407876188,'v1.0.5':407829109,'v1.0.4':407790819,'v1.0.3':407158795,'v1.0.2':406775606,'v1.0.1':406537316}
          NEW = {'latest.yml':(365,'sha256:12c5ac823d8e73b0d874d429b815f9c07f720535266b3ab0895aa7eb342296f8'),'LDPi-Workspace-Setup-2.0.1-x64.exe':(251771367,'sha256:804d4cde7e406b66fc10bc6bc5d346960734778f4a4bbca85439e8eb233086bf'),'LDPi-Workspace-Setup-2.0.1-x64.exe.blockmap':(262011,'sha256:5b87dcb621632b858c99f0e54b7a599e772dd4dfc63c27f3b2be6cdface61f02')}
          def api(route, auth=True, method='GET', data=None):
              headers={'Accept':'application/vnd.github+json','User-Agent':'LDPi-release-retirement','X-GitHub-Api-Version':'2022-11-28'}
              if auth: headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              body=json.dumps(data).encode() if data is not None else None
              if body is not None: headers['Content-Type']='application/json'
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+route,data=body,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=120) as r: return json.load(r)
          current=api('/releases/latest',False)
          assert current['id']==411454549 and current['tag_name']=='v2.0.1' and not current['draft'] and not current['prerelease']
          assert {a['name']:(a['size'],a['digest']) for a in current['assets']}==NEW
          selected=[api('/releases/'+str(i)) for i in OLD.values()]
          assert all(r['id']==OLD[r['tag_name']] and not r['immutable'] for r in selected)
          urls=[a['browser_download_url'] for r in selected for a in r['assets']]
          assert len(urls)==36
          for release in selected:
              result=api('/releases/'+str(release['id']),method='PATCH',data={'draft':True,'make_latest':'false'})
              assert result['draft'] and result['id']==release['id']
              print('Unpublished',release['tag_name'],flush=True)
          for attempt in range(6):
              public=api('/releases?per_page=100',False)
              if all(r['tag_name'] not in OLD for r in public): break
              time.sleep(10)
          assert all(r['tag_name'] not in OLD for r in public)
          assert api('/releases/latest',False)['tag_name']=='v2.0.1'
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'LDPi-release-retirement'},method='HEAD')
              try:
                  with urllib.request.urlopen(req,timeout=60) as r: raise AssertionError('Old public download still accessible: '+url)
              except urllib.error.HTTPError as e:
                  assert e.code==404, (url,e.code)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# Public downloads verified\n\nOnly v2.0.1 remains published. All 11 archived releases are unpublished as writer-only drafts, and all 36 old asset URLs returned 404 without authentication.\n\nThe new release and update files remain public and unchanged. Private backups were verified in LDPi-Workspace-backups before this run.\n')
          print('COMPLETE: 11 old releases hidden; 36 old download URLs return 404; v2.0.1 remains latest.',flush=True)
          PY
